intervention:
  summary: |
    Upgraded run.py + program.md from isolated per-trade strategy Sharpe to a
    full multi-strategy daily portfolio evaluation system:
    (1) True daily equity-curve analytics (`daily_sharpe`, `daily_sortino`,
        `cagr_pct`, `calmar`, `ulcer_index`, `martin_ratio`, `max_dd_days`),
        fixing the legacy FreqTrade per-trade stddev denominator mismatch vs BaH.
    (2) Benchmark OLS decomposition (`alpha_ann_pct`, `beta`, `info_ratio`) vs
        equal-weight Buy-and-Hold + exact merged `time_in_market_pct`,
        `capital_util_pct`, and inverse-HHI `effective_pairs`.
    (3) Calibrated multi-objective gates:
        - `regime_return_gate` (bull/rec >= +10%, full_5y >= +20%, bear >= -2%
          capital preservation and beating BaH)
        - `exposure_gate` (worst avg stake >= 5%, time_in_market >= 2%)
        - `pareto_dominated_by` on 3D `(robust_sharpe, cagr_pct, max_dd)`
          decoupled from killed strategies.
    (4) Cross-strategy `PORTFOLIO_SUMMARY` (`PORTFOLIO_EQ`):
        `portfolio_robust_sharpe`, `portfolio_robust_sortino`,
        `diversification_gain`, pairwise daily & drawdown-day tail correlations
        (`diversification_gate < 0.60`), and leave-one-out
        `marginal_robust_sharpe` (`[ACCRETIVE]` vs `[DILUTIVE]`).

