findings:
  - id: F1
    title: Marginal portfolio Sharpe prevents premature rollback of winter-hedging components
    summary: |
      In R4-R5, BnbMeanRevert's standalone robust_sharpe briefly turned slightly
      negative (-0.024) on recovery, yet PORTFOLIO_SUMMARY showed it remained
      strongly [ACCRETIVE] (+0.41 marginal_robust_sharpe) by hedging 2022 winter.
      Keeping the slot alive allowed R7 ablation + R11 synthesis to unlock 0.6441.
  - id: F2
    title: Regime-conditional exits resolve the MR patient-vs-tight exit dilemma
    summary: |
      Unconditional slow exit (RSI > 65, R9) collapsed BnbMeanRevert from +0.38
      to -0.06; unconditional fast exit (RSI > 55) capped recovery at +4.78%.
      Conditioning exit threshold on `close > sma20_1d` (RSI > 65 in uptrends,
      RSI > 55 below) lifted recovery to +10.35% on identical 80 trades and
      pushed standalone robust_sharpe from 0.3808 to 0.6441.
  - id: F3
    title: Orthogonal MTF paradigms achieve negative drawdown-day tail correlation
    summary: |
      Combining alts BB-MR, BNB extreme-RSI MR, and BTC/ETH Donchian breakout
      produced near-zero daily correlation (<= 0.075) and strictly negative
      loss-day tail correlation (-0.194 to -0.390), lifting 5y portfolio daily
      Sharpe to 1.7146 (vs 1.1482 BaH) at beta = 0.0011 and -2.84% max DD.
